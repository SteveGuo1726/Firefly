name: EdgeOne read-only production diagnosis
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/edgeone-readonly-diagnosis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'SteveGuo1726/Firefly' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EDGEONE_PROJECT_ID: ${{ secrets.EDGEONE_PROJECT_ID }}
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read existing EdgeOne project deployments and sanitized build logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edgeone-readonly"
          cd "$RUNNER_TEMP/edgeone-readonly"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --silent @edgeone/makers-sdk@0.1.0
          cat > diagnose.mjs <<'EDGEONE_DIAGNOSTIC_JS'
          import { Makers } from "@edgeone/makers-sdk";
          
          const token=process.env.EDGEONE_API_TOKEN?.trim();
          const projectId=process.env.EDGEONE_PROJECT_ID?.trim();
          if(!token || !projectId){ console.error("MISSING_SECRET: EDGEONE_API_TOKEN or EDGEONE_PROJECT_ID"); process.exit(2); }
          const mask=(input)=>String(input??"")
           .replaceAll(token,"[REDACTED]")
           .replaceAll(projectId,"[PROJECT_ID]")
           .replace(/(?:github_pat_|ghp_|gho_)[a-z0-9_]+/gi,"[GITHUB_TOKEN]")
           .replace(/(?:Bearer\s+)[A-Za-z0-9_.~-]+/gi,"Bearer [REDACTED]")
           .replace(/https?:\/\/\S+/gi,"[URL]")
           .slice(0,220);
          const makers=new Makers({token,timeout:25,retries:1});
          function error(e,phase) {
           console.log("DIAG_ERROR",phase, mask(e?.name), mask(e?.code), "http="+mask(e?.httpStatus), "detail="+mask(e?.message));
          }
          let project;
          try {
           project=await makers.projects.get({projectId});
           console.log("PROJECT",JSON.stringify({name:project.name,status:project.status,presetDomain:project.presetDomain}));
          }catch(e){error(e,"PROJECT_GET");process.exit(3);}
          let page;
          try{
           page=await makers.deployments.list({projectId,page:0,pageSize:20,order:{field:"createdOn",direction:"desc"}});
           console.log("DEPLOYMENTS_TOTAL",page.total);
           for(const d of page.items)console.log("DEPLOYMENT",JSON.stringify({
            id:d.deploymentId,env:d.env,status:d.status,code:d.code,
            createdOn:d.createdOn,modifiedOn:d.modifiedOn,
            repoBranch:d.repoBranch,commitId:d.commitId,repoCommit:d.repoCommit
           }));
          }catch(e){error(e,"DEPLOYMENTS_LIST");process.exit(4);}
          for(const dep of page.items.slice(0,4)){
           try{
            const log=await makers.deployments.getLog({projectId,deploymentId:dep.deploymentId});
            if(!log?.logUrl){console.log("LOG_UNAVAILABLE",dep.deploymentId);continue;}
            const response=await fetch(log.logUrl,{signal:AbortSignal.timeout(20000)});
            if(!response.ok){console.log("LOG_HTTP",dep.deploymentId,response.status);continue;}
            const body=(await response.text()).slice(0,250000);
            const lines=body.split(/\r?\n/);
            const matches=[];
            for(let i=0;i<lines.length;i++){
             if(/error|fail(ed|ure)?|err_pnpm|not found|timeout|cancel|deploy|build|node\.js|pnpm|npm|fatal|429|403|404|limit/i.test(lines[i])){
              matches.push([i+1,mask(lines[i])]);
             }
            }
            console.log("LOG_SUMMARY",dep.deploymentId,"lines="+lines.length,"matches="+matches.length);
            for(const [line,content] of matches.slice(-35))console.log("LOG_LINE",dep.deploymentId,line,content);
           }catch(e){error(e,"GET_LOG:"+dep.deploymentId);}
          }
          
          EDGEONE_DIAGNOSTIC_JS
          node diagnose.mjs
