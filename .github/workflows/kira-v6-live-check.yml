name: KIRA V7.3 Cloudflare live verification
on:
  push:
    branches: [kira-development]
    paths:
      - '.github/workflows/kira-v6-live-check.yml'
      - 'public/index.html'
      - 'public/assets/app.js'
      - 'public/assets/style.css'
      - 'public/assets/pixiv-feed.json'
      - 'preview/build.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe deployed CF frontend and metadata with browser headers
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,datetime,pathlib
          base="https://kira-cf.casto.top"
          paths={"/": "text/html","/assets/style.css":"text/css","/assets/app.js":"application/javascript","/assets/pixiv-feed.json":"application/json","/health":"application/json"}
          report={"date":datetime.datetime.now(datetime.timezone.utc).isoformat(),"checks":{}}
          for path,want in paths.items():
            result={}
            try:
              req=urllib.request.Request(base+path,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36","Accept":"text/html,application/json;q=0.9,*/*;q=0.8"})
              with urllib.request.urlopen(req,timeout=12) as r:
                body=r.read()
                result={"http_status":r.status,"bytes":len(body),"mime":r.headers.get('content-type')}
                if path=="/assets/pixiv-feed.json":
                  j=json.loads(body);result["works_in_snapshot"]=sum(len(a) for a in j["channels"].values());result["channels"]={k:len(v) for k,v in j["channels"].items()}
                  result["explicit_tagged"]=sum(1 for a in j["channels"].values() for w in a if any(str(tag).strip().lower() in ["r-18","r18","r18g","nsfw","explicit"] for tag in w.get("tags",[])))
                if path=="/assets/app.js":
                  code=body.decode()
                  result["real_pixiv_loader"]="hydrateRealPixiv" in code
                  result["progressive_loading"]="loadWorkPreview" in code and "imageWithFailover" in code
                  result["independent_axes"]="zoomX" in code and "zoomY" in code
                  result["new_relation_axes"]="if(axis===\u0027series\u0027)" in code and "if(axis===\u0027artist\u0027)" in code
                if path=="/":
                  result["no_top_strip"]='class="reader-top"' not in body.decode()
                  result["new_jump_tabs"]='data-path="series"' in body.decode() and 'data-path="artist"' in body.decode()
                if path=="/health":result["expected_version"]="7.3.0"
                if path=="/health":result["server"]=json.loads(body)
            except urllib.error.HTTPError as e: result={"error":str(e),"body":e.read(100).decode(errors="replace")}
            except Exception as e:result={"error":str(e)}
            print(path,result)
            report["checks"][path]=result
          # HEAD verifies response and MIME only; it does not claim successful browser decoding.
          samples=[]
          try:
            req=urllib.request.Request(base+"/assets/pixiv-feed.json",headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=10) as resp: source=json.load(resp)
            example=source["channels"]["miku"][0]
            for key in ("thumbnail_url","preview_url","original_url"):
              item={"quality":key,"pixiv_id":example["pid"],"check":"HEAD-only"}
              try:
                head=urllib.request.Request(example[key],method="HEAD",headers={"User-Agent":"Mozilla/5.0"})
                with urllib.request.urlopen(head,timeout=10) as media:
                  item["http_status"]=media.status
                  item["mime"]=media.headers.get("content-type")
              except Exception as ex:item["error"]=str(ex)[:160]
              samples.append(item)
          except Exception as ex:samples.append({"error":"sample_setup: "+str(ex)[:180]})
          report["external_image_head_samples"]=samples
          health=report["checks"].get("/health",{})
          report["gallery_v73_pass"]=(health.get("server",{}).get("version")=="7.3.0" and report["checks"].get("/",{}).get("new_jump_tabs") and report["checks"].get("/assets/app.js",{}).get("new_relation_axes") and report["checks"].get("/assets/pixiv-feed.json",{}).get("works_in_snapshot",0)>=30)
          pathlib.Path("docs").mkdir(exist_ok=True)
          pathlib.Path("docs/kira-v6-live-check.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Record report
        if: always()
        shell: bash
        run: |
          if [ -f docs/kira-v6-live-check.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/kira-v6-live-check.json
            git commit -m "test(kira): save V7.2 Cloudflare live route report" || exit 0
            git push origin HEAD:kira-development
          fi
