name: KIRA EdgeOne preview
on:
  push:
    branches: [kira-edgeone-preview]
    paths:
      - 'kira-edgeone/**'
      - '.github/workflows/kira-edgeone-preview.yml'
  workflow_dispatch:
jobs:
  edgeone-preview:
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm EdgeOne token is connected
        id: credential
        shell: bash
        run: |
          if [ -n "$EDGEONE_API_TOKEN" ]; then echo 'available=true' >> "$GITHUB_OUTPUT"; else echo 'available=false' >> "$GITHUB_OUTPUT"; echo 'Skipping EdgeOne deployment: EDGEONE_API_TOKEN not configured.'; fi
      - uses: actions/setup-node@v4
        if: steps.credential.outputs.available == 'true'
        with:
          node-version: '22'
      - name: Deploy preview to EdgeOne Pages
        if: steps.credential.outputs.available == 'true'
        run: npx --yes edgeone makers deploy ./kira-edgeone -n kira-jump-preview -e preview -t "$EDGEONE_API_TOKEN"
