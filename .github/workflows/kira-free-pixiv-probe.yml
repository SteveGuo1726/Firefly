name: KIRA public Pixiv metadata snapshot
on:
  workflow_dispatch:
  # Scheduled workflows only run on a repository's default branch. Do not touch Firefly master.
  # On this isolated kira-development branch, use workflow_dispatch or workflow-file push.
  push:
    branches: [kira-development]
    paths:
      - '.github/workflows/kira-free-pixiv-probe.yml'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test Lolicon and generate a compact SFW Pixiv metadata snapshot
        shell: bash
        run: |
          mkdir -p pixiv/data docs
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, datetime, os, time
          NOW=datetime.datetime.now(datetime.timezone.utc).isoformat()
          queries={"discover":"","miku":"初音ミク","genshin":"原神","girl":"女の子",
                   "original":"オリジナル","touhou":"東方Project","bluearchive":"ブルーアーカイブ",
                   "arknights":"アークナイツ","fantasy":"ファンタジー","landscape":"風景"}
          rotation=["original","touhou","bluearchive","arknights","fantasy","landscape","discover","miku","genshin","girl"]
          step=int(os.environ.get("GITHUB_RUN_NUMBER","1"))
          offset=(step-1)*3 % len(rotation)
          selected={rotation[(offset+i)%len(rotation)] for i in range(3)}
          print("Free snapshot rotation:",sorted(selected))
          try:
            with open("pixiv/data/feed.json") as f:prior=json.load(f)
          except Exception:prior={"channels":{},"generated_at":NOW}
          store={"generated_at":NOW,"provider":"lolicon","r18":False,"channels":{},"safety_filter":"r18_false_plus_explicit_tag_rejection"}
          tests={"tested_at":NOW,"results":[]}
          hosts={"i.pixiv.re","i.pixiv.cat","i-cf.pximg.net","i.pximg.net"}
          def clean(url):
            try:
              u=urllib.parse.urlparse(url)
              return url if u.scheme=="https" and u.hostname in hosts else None
            except Exception: return None
          for channel,word in queries.items():
            if channel not in selected:
              store["channels"][channel]=prior.get("channels",{}).get(channel,[])
              continue
            if len(tests["results"]): time.sleep(3)
            query=[("num","20"),("r18","0"),("excludeAI","true"),("size","small"),("size","regular"),("size","original")]
            if word: query.append(("keyword",word))
            req=urllib.request.Request("https://api.lolicon.app/setu/v2?"+urllib.parse.urlencode(query),headers={"Accept":"application/json","User-Agent":"KIRA-Free-Pixiv-Dev/0.2"})
            result={"channel":channel,"provider":"lolicon","scheduled_rotation":True}
            items=[]
            try:
              with urllib.request.urlopen(req,timeout=16) as response:
                obj=json.load(response)
                result["http_status"]=response.status
                for x in obj.get("data",[]):
                  if x.get("r18",True) not in (False,0) or x.get("aiType")==2: continue
                  if any(__import__('re').fullmatch(r'r[\s_-]*18(?:g)?|nsfw|explicit|adult|成人向|18禁',str(tag).strip(),__import__('re').I) for tag in x.get('tags',[])): continue
                  try: pid=int(x.get("pid",0));uid=int(x.get("uid",0))
                  except Exception: continue
                  urls=x.get("urls",{})
                  original=clean(urls.get("original"))
                  preview=clean(urls.get("regular")) or original
                  thumb=clean(urls.get("small")) or preview
                  if not pid or not thumb: continue
                  items.append({"id":"pixiv:"+str(pid)+":"+str(x.get("p",0)),"pid":pid,"page":int(x.get("p",0)), "title":str(x.get("title",""))[:130],"author":str(x.get("author",""))[:90],"uid":uid,"tags":[str(t)[:40] for t in x.get("tags",[])[:16]],"width":x.get("width"),"height":x.get("height"),"thumbnail_url":thumb,"preview_url":preview,"original_url":original or preview,"pixiv_url":"https://www.pixiv.net/artworks/"+str(pid),"artist_url":"https://www.pixiv.net/users/"+str(uid) if uid>0 else None,"license":"原作者保留版权","r18":False,"external":True})
              result["count"]=len(items)
            except Exception as e:result["error"]=str(e)[:180]
            previous=prior.get("channels",{}).get(channel,[])
            old_by_id={x["id"]:x for x in previous}
            merged=[];seen=set()
            for item in items+previous:
              if item["id"] in seen:continue
              if item["id"] in old_by_id:
                for field in ["dominant_tone","dominant_hex","color_method"]:
                  if old_by_id[item["id"]].get(field):item[field]=old_by_id[item["id"]][field]
              seen.add(item["id"]);merged.append(item)
            store["channels"][channel]=merged[:72]
            result["total_after_merge"]=len(store["channels"][channel])
            if not items:result["fallback"]="preserved previously verified channel"
            tests["results"].append(result)
            print(json.dumps(result,ensure_ascii=False))
          first=next((it for arr in store["channels"].values() for it in arr),None)
          if first:
            for quality in ["thumbnail_url","preview_url"]:
              u=first.get(quality)
              if not u:continue
              status={"check":"image_"+quality,"host":urllib.parse.urlparse(u).hostname}
              try:
                request=urllib.request.Request(u,method="HEAD",headers={"User-Agent":"Mozilla/5.0"})
                with urllib.request.urlopen(request,timeout=12) as rsp:
                  status["http_status"]=rsp.status
                  status["mime"]=rsp.headers.get("content-type")
              except Exception as e:status["error"]=str(e)[:160]
              tests["results"].append(status)
          if sum(len(v) for v in store["channels"].values())<20:
            raise SystemExit("Not replacing snapshot with low/empty upstream results")
          if not any(t.get("count",0)>0 for t in tests["results"]):
            store["generated_at"]=prior.get("generated_at",NOW)
          with open("pixiv/data/feed.json","w") as f:json.dump(store,f,ensure_ascii=False,indent=2)
          with open("public/assets/pixiv-feed.json","w") as f:json.dump(store,f,ensure_ascii=False,indent=2)
          with open("docs/pixiv-smoke-results.json","w") as f:json.dump(tests,f,ensure_ascii=False,indent=2)
          PY
      - name: Publish verified metadata only (never original image bytes)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixiv/data/feed.json public/assets/pixiv-feed.json docs/pixiv-smoke-results.json
          git commit -m "data(kira): refresh free Pixiv metadata snapshot" || exit 0
          git pull --rebase origin kira-development
          git push origin HEAD:kira-development
