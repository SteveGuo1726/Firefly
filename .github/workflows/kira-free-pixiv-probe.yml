name: KIRA free Pixiv API connectivity
on:
  push:
    branches: [kira-development]
    paths: [.github/workflows/kira-free-pixiv-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public free Pixiv metadata endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          cases = [
           ("lolicon", "https://api.lolicon.app/setu/v2?r18=0&num=3&excludeAI=true&size=small&size=regular&size=original"),
           ("anosu", "https://image.anosu.top/pixiv/json?num=3&r18=0&size=regular"),
           ("cf_lolicon", "https://kira-free-pixiv-probe.guojunyang666666.workers.dev/lolicon"),
           ("cf_anosu", "https://kira-free-pixiv-probe.guojunyang666666.workers.dev/anosu")
          ]
          for name,url in cases:
           try:
            req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"KiraJump-FreeSource-ConnectivityTest/1"})
            with urllib.request.urlopen(req,timeout=13) as r:
             response=json.load(r)
             items = response if isinstance(response,list) else response.get("data",response.get("images",[]))
             if not isinstance(items,list):items=response.get("images",[]) if isinstance(response,dict) else []
             print(json.dumps({"source":name,"status":r.status,"keys":list(response)[:10] if isinstance(response,dict) else [],"count":len(items),"sample":[{"pid":x.get("pid"),"title":str(x.get("title",""))[:70],"domain":str(x.get("urls",{}).get("regular",x.get("url","")))[:110]} for x in items[:2] if isinstance(x,dict)],"error":response.get("error") if isinstance(response,dict) else None},ensure_ascii=False))
           except Exception as e:
            print(json.dumps({"source":name,"error":str(e)[:210]},ensure_ascii=False))
          PY
