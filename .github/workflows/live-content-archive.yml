name: Live Content Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: live-content-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    if: ${{ vars.FIREFLY_ARCHIVE_BRANCH != '' && vars.FIREFLY_LIVE_CONTENT_EXPORT_URL != '' && (vars.FIREFLY_ARCHIVE_BRANCH != 'master' || vars.FIREFLY_ARCHIVE_ALLOW_MASTER == 'true') }}
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ vars.FIREFLY_ARCHIVE_BRANCH }}
      FIREFLY_LIVE_CONTENT_EXPORT_URL: ${{ vars.FIREFLY_LIVE_CONTENT_EXPORT_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout archive branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ vars.FIREFLY_ARCHIVE_BRANCH }}
          fetch-depth: 0

      - name: Apply live content snapshot
        run: node scripts/archive-live-content.mjs

      - name: Commit archive snapshot
        shell: bash
        run: |
          if git diff --quiet -- src/content/posts src/content/dynamic; then
            echo "No live content changes to archive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/content/posts src/content/dynamic
          git commit -m "chore(content): archive live content"
          git push origin "HEAD:${TARGET_BRANCH}"
